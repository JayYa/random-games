<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 样式表到之前，深色设备也先铺深底，夜里不闪白。 -->
    <meta name="color-scheme" content="light dark" />
    <!-- 与 style.css 的 --page 两套取值一致。 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#16161c" />
    <title>是但</title>
  </head>
  <body>
    <!-- 空壳：选主题页和转盘页都由 main.ts 按当前 hash 渲染进来。
         这里不写死任何一个主题的标题，也不写加载态——首页不取名单，
         「正在加载名单…」只有在转盘页才是真话。 -->
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
