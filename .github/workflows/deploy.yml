# 推送到默认分支即部署：构建产物直接发布到 GitHub Pages（ADR-0001，不引入第三方托管）。
# 只改 public/ 下的某份名单 CSV 并推送，同样会走完整个流程，线上名单随之更新。
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # 允许在 Actions 页面手动重跑一次部署，不必为此造一个空提交。
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只跑一个部署；排队中的旧任务可以丢弃，但不要打断正在进行的发布。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 版本跟着 package.json 里的 packageManager 字段走，不用在这里重复写死。
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 测试跑在构建之前：坏掉的改动不该有机会发布出去。
      - run: pnpm test

      - run: pnpm build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
